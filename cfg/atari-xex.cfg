# Memory map for an Atari XL/XE (64 KB) executable. Each area with a file becomes one load
# segment of the final .xex (see tools/mkxex.py).
#
#   $0080-$00F7  zero page variables
#   $0600-$06EF  tables (timed tiles, pegs, belt animation); the TEST build keeps its joystick at $06F0
#   $2000-$5FFF  code and read-only data (levels, screens, sprites)
#   $6000-$63FF  character set          (1 KB aligned, set by CHBAS)
#   $6400-$64FF  ANTIC display list     (must not cross a 1 KB boundary)
#   $6500-$68FF  screen RAM             (equate SCREEN in main.s, filled at run time)
#   $7000-$77FF  player/missile RAM     (2 KB aligned, equate PMAREA in main.s)
MEMORY {
    ZP:      file = "",                       start = $0080, size = $0078;
    BSS:     file = "",                       start = $0600, size = $00F0;
    CODE:    file = "build/code.bin",    start = $2000, size = $4000;
    CHARSET: file = "build/charset.bin", start = $6000, size = $0400;
    DLIST:   file = "build/dlist.bin",   start = $6400, size = $0100;
}

SEGMENTS {
    ZEROPAGE: load = ZP,      type = zp;
    BSS:      load = BSS,     type = bss;
    CODE:     load = CODE,    type = ro;
    RODATA:   load = CODE,    type = ro;
    CHARSET:  load = CHARSET, type = ro;
    DLIST:    load = DLIST,   type = ro;
}
