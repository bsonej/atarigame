# Memory map for an Atari XL/XE (64 KB) executable. Each area with a file becomes one load
# segment of the final .xex (see tools/mkxex.py).
#
#   $0080-$00DF  zero page variables
#   $2000-$3FFF  code and read-only data (levels, sprites)
#   $4000-$43FF  character set          (1 KB aligned, set by CHBAS)
#   $4400-$44FF  ANTIC display list     (must not cross a 1 KB boundary)
#   $4500-$48FF  screen RAM             (equate SCREEN in main.s, filled at run time)
#   $5000-$57FF  player/missile RAM     (2 KB aligned, equate PMAREA in main.s)
MEMORY {
    ZP:      file = "",                  start = $0080, size = $0060;
    CODE:    file = "build/code.bin",    start = $2000, size = $2000;
    CHARSET: file = "build/charset.bin", start = $4000, size = $0400;
    DLIST:   file = "build/dlist.bin",   start = $4400, size = $0100;
}

SEGMENTS {
    ZEROPAGE: load = ZP,      type = zp;
    CODE:     load = CODE,    type = ro;
    RODATA:   load = CODE,    type = ro;
    CHARSET:  load = CHARSET, type = ro;
    DLIST:    load = DLIST,   type = ro;
}
