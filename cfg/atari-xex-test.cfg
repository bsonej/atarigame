# Same layout as atari-xex.cfg, writing into build/test/ (used by 'task build-test').
# Memory map for an Atari XL/XE (64 KB) executable. Each area with a file becomes one load
# segment of the final .xex (see tools/mkxex.py).
#
#   $0080-$00F7  zero page variables
#   $0600-$06EF  tables (timed tiles, pegs, belt animation); the TEST build keeps its joystick at $06F0
#   $0700-$1FFF  the level maps
#   $2000-$5FFF  code and read-only data (sprites, tables)
#   $6000-$63FF  character set          (1 KB aligned, set by CHBAS)
#   $6400-$64FF  ANTIC display lists    (filled at startup, not stored)
#   $6500-$68FF  screen RAM             (equate SCREEN in main.s, filled at run time)
#   $7000-$77FF  player/missile RAM     (2 KB aligned, equate PMAREA in main.s)
#   $8000-$9B8F  the title picture      (unpacked at startup; ANTIC mode E, 4 KB aligned)
#   $9C00-$B342  the title song         (RMT player, then the module at $A400)
#   $B600-$BFFF  the packed title picture
MEMORY {
    ZP:      file = "",                       start = $0080, size = $0078;
    BSS:     file = "",                       start = $0600, size = $00F0;
    LEVELS:  file = "build/test/levels.bin",  start = $0700, size = $1900;
    CODE:    file = "build/test/code.bin",    start = $2000, size = $4000;
    CHARSET: file = "build/test/charset.bin", start = $6000, size = $0400;
    DLIST:   file = "",                            start = $6400, size = $0100;
    SPLASH:  file = "",                            start = $8000, size = $1C00;
    SONG:    file = "build/test/song.bin",    start = $9C00, size = $1743;
    PACK:    file = "build/test/splash.bin",  start = $B600, size = $0A00;
}

SEGMENTS {
    ZEROPAGE: load = ZP,      type = zp;
    BSS:      load = BSS,     type = bss;
    CODE:     load = CODE,    type = ro;
    RODATA:   load = CODE,    type = ro;
    LEVELS:   load = LEVELS,  type = ro;
    CHARSET:  load = CHARSET, type = ro;
    DLIST:    load = DLIST,   type = bss;
    SPLASH:   load = SPLASH,  type = bss;
    SONG:     load = SONG,     type = ro;
    PACK:     load = PACK,    type = ro;
}
